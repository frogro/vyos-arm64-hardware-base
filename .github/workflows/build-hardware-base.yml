name: Build Armbian Hardware Base

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Exact Armbian BOARD identifier"
        required: true
        type: string
      profile:
        description: "Image profile"
        required: true
        default: stock
        type: choice
        options:
          - stock
          - vyos-base
          - vyos-parity
      branch:
        description: "Armbian kernel branch"
        required: true
        default: edge
        type: choice
        options:
          - edge
      release:
        description: "Debian/Ubuntu release"
        required: true
        default: trixie
        type: string
      armbian_ref:
        description: "Legacy A/B Armbian ref; Profile C freezes current main itself"
        required: false
        default: main
        type: string
      vyos_version:
        description: "VyOS Rolling reference for profile C"
        required: false
        default: latest
        type: string
      publish:
        description: "Create a GitHub release after successful build"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.profile != 'vyos-parity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout hardware-base repository
        uses: actions/checkout@v7

      - name: Validate profile implementation state
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.profile }}" in
            stock)
              ;;
            vyos-base)
              if [[ "${{ inputs.board }}" != "rpi4b" ]]; then
                echo "Profile B is currently implemented only for BOARD=rpi4b." >&2
                echo "Target-board resolution for other ARM64 boards is not complete yet." >&2
                exit 20
              fi
              ;;
            vyos-parity)
              echo "Profile C is intentionally blocked until profile B and VyOS kernel-parity policy are imported." >&2
              exit 21
              ;;
            *)
              exit 22
              ;;
          esac

      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Checkout exact Armbian build framework
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/armbian/build.git armbian-build
          git -C armbian-build checkout '${{ inputs.armbian_ref }}'
          git -C armbian-build rev-parse HEAD | tee armbian-build-commit.txt

      - name: Prepare native Armbian build host
        working-directory: armbian-build
        shell: bash
        run: |
          set -euo pipefail
          sudo ./compile.sh requirements
          sudo chown -R "$USER:$USER" .

      - name: Verify exact Armbian board and edge target
        shell: bash
        run: |
          set -euo pipefail
          found=
          for ext in conf csc wip eos tvb; do
            p="armbian-build/config/boards/${{ inputs.board }}.${ext}"
            if [[ -f "$p" ]]; then found="$p"; break; fi
          done
          [[ -n "$found" ]] || { echo "Unknown Armbian BOARD=${{ inputs.board }}" >&2; exit 30; }
          grep -Eq 'KERNEL_TARGET=.*(^|,|")edge(,|"|$)' "$found" || {
            echo "BOARD=${{ inputs.board }} does not advertise edge at this Armbian ref" >&2
            exit 31
          }
          echo "Using board config: $found"

      - name: Prepare Profile B kernel configuration
        if: ${{ inputs.profile == 'vyos-base' }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "${{ inputs.board }}" == "rpi4b" ]] || {
            echo "Profile B target resolution not implemented for BOARD=${{ inputs.board }}" >&2
            exit 32
          }

          base="armbian-build/config/kernel/linux-bcm2711-edge.config"
          req="profiles/vyos-base/kernel-required.tsv"
          dst="armbian-build/userpatches/linux-bcm2711-edge.config"

          [[ -f "$base" ]] || { echo "Missing Armbian base config: $base" >&2; exit 33; }
          [[ -f "$req" ]] || { echo "Missing Profile B requirements: $req" >&2; exit 34; }

          mkdir -p armbian-build/userpatches

          ./scripts/apply-kconfig-requirements.py             "$base"             "$req"             "$dst"

          python3 - "$req" "$dst" <<'PYCHECK'
          from pathlib import Path
          import re
          import sys

          reqfile = Path(sys.argv[1])
          cfgfile = Path(sys.argv[2])

          req = {}
          for line in reqfile.read_text().splitlines():
              if line.strip():
                  k, v = line.split("\t", 1)
                  req[k] = v

          cfg = {}
          for line in cfgfile.read_text().splitlines():
              m = re.match(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$", line)
              if m:
                  cfg[m.group(1)] = m.group(2)

          bad = [(k, v, cfg.get(k, "<missing>"))
                 for k, v in req.items()
                 if cfg.get(k) != v]

          print(f"Profile B requirements: {len(req)}")
          print(f"Exact pre-Kconfig matches: {len(req) - len(bad)}")
          print(f"Missing/mismatching: {len(bad)}")

          for row in bad[:50]:
              print("\t".join(row))

          if bad:
              raise SystemExit(35)
          PYCHECK

          sha256sum "$req" "$dst"

      - name: Build Armbian Edge minimal image
        working-directory: armbian-build
        shell: bash
        run: |
          set -euo pipefail
          echo "===== BUILD HOST BEFORE COMPILE ====="
          echo "Time: $(date -u --iso-8601=seconds)"
          echo "CPU:"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket' || true
          echo
          free -h
          echo
          swapon --show || true
          echo
          df -h /
          echo

          (
            while true; do
              echo
              echo "===== RESOURCE MONITOR $(date -u --iso-8601=seconds) ====="
              uptime || true

              echo "--- memory ---"
              free -h || true

              echo "--- swap ---"
              swapon --show || true

              echo "--- disk ---"
              df -h / || true

              echo "--- top CPU/RAM processes ---"
              ps -eo pid,ppid,state,%cpu,%mem,rss,etime,comm,args \
                --sort=-%cpu | head -30 || true

              echo "--- compiler processes ---"
              ps -eo pid,ppid,state,%cpu,%mem,rss,etime,comm,args |
                grep -E '(^|/)(cc1|gcc|g\+\+|make|ninja|ld)( |$)' |
                grep -v grep || true

              echo "===== END RESOURCE MONITOR ====="
              sleep 60
            done
          ) &

          MONITOR_PID=$!

          stop_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }

          trap stop_monitor EXIT

          ./compile.sh build \
            PREFER_DOCKER=no \
            KERNEL_BTF=no \
            BOARD='${{ inputs.board }}' \
            BRANCH='${{ inputs.branch }}' \
            RELEASE='${{ inputs.release }}' \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            KERNEL_CONFIGURE=no \
            NETWORKING_STACK=systemd-networkd \
            COMPRESS_OUTPUTIMAGE=xz \
            SHARE_LOG=no

      - name: Collect image and build metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t imgs < <(find armbian-build/output/images -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.xz' -o -name '*.img.zst' \) -print)
          ((${#imgs[@]} > 0)) || { echo "No image found" >&2; exit 40; }
          cp -a "${imgs[@]}" release-assets/
          cp armbian-build-commit.txt release-assets/

          if [[ "${{ inputs.profile }}" == "vyos-base" ]]; then
            cp profiles/vyos-base/kernel-required.tsv               release-assets/kernel-required.tsv
            cp armbian-build/userpatches/linux-bcm2711-edge.config               release-assets/requested-linux-bcm2711-edge.config
          fi

          cat > release-assets/BUILD-INFO.txt <<EOF
          board=${{ inputs.board }}
          profile=${{ inputs.profile }}
          branch=${{ inputs.branch }}
          release=${{ inputs.release }}
          armbian_ref=${{ inputs.armbian_ref }}
          armbian_commit=$(cat armbian-build-commit.txt)
          github_run_id=${{ github.run_id }}
          github_sha=${{ github.sha }}
          EOF
          (
            cd release-assets
            sha256sum * > SHA256SUMS
          )
          ls -lh release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hardware-base-${{ inputs.board }}-${{ inputs.profile }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Publish private GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          short="${{ inputs.armbian_ref }}"
          short="${short:0:12}"
          tag="hb-${{ inputs.board }}-${{ inputs.profile }}-${{ github.run_number }}"
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ inputs.board }} / ${{ inputs.profile }} / Armbian Edge" \
            --notes "BOARD=${{ inputs.board }}; profile=${{ inputs.profile }}; branch=${{ inputs.branch }}; release=${{ inputs.release }}; Armbian ref=${{ inputs.armbian_ref }}."

  profile-c:
    if: ${{ inputs.profile == 'vyos-parity' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout hardware-base repository
        uses: actions/checkout@v7

      - name: Validate Profile C target
        shell: bash
        run: |
          set -euo pipefail

          case "${{ inputs.board }}" in
            rpi4b|radxa-e52c)
              ;;
            *)
              echo "Profile C is currently enabled for BOARD=rpi4b and BOARD=radxa-e52c." >&2
              exit 21
              ;;
          esac

          [[ "${{ inputs.branch }}" == "edge" ]] || {
            echo "Profile C currently requires BRANCH=edge." >&2
            exit 22
          }

          [[ "${{ inputs.release }}" == "trixie" ]] || {
            echo "Profile C currently requires RELEASE=trixie." >&2
            exit 23
          }

          case "${{ inputs.vyos_version }}" in
            ""|latest)
              ;;
            *)
              echo "Profile C resolves the current official VyOS Rolling itself; use vyos_version=latest." >&2
              exit 24
              ;;
          esac

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            || true

          df -h /

      - name: Install Profile C snapshot dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            file \
            git \
            jq \
            minisign \
            p7zip-full \
            python3 \
            rsync \
            squashfs-tools \
            wget \
            xorriso \
            xz-utils \
            zstd

      - name: Initialize Armbian base repository and build host
        shell: bash
        run: |
          set -euo pipefail

          ARB_BASE="$HOME/.cache/vyos-armbian-hwbase/armbian-build"

          mkdir -p "$(dirname "$ARB_BASE")"

          git clone \
            --filter=blob:none \
            --no-tags \
            --branch main \
            https://github.com/armbian/build.git \
            "$ARB_BASE"

          echo
          echo "===== INITIAL ARMBIAN MAIN ====="
          git -C "$ARB_BASE" rev-parse HEAD

          (
            cd "$ARB_BASE"
            sudo ./compile.sh requirements
          )

          sudo chown -R "$USER:$USER" "$ARB_BASE"

      - name: Freeze current Armbian, VyOS Rolling and target kernel
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          LOG="$(mktemp)"

          ./scripts/prepare-c-snapshot.sh \
            '${{ inputs.board }}:${{ inputs.branch }}:${{ inputs.release }}' \
            | tee "$LOG"

          SNAP="$(
            sed -n 's/^SNAPSHOT_DIR=//p' "$LOG" |
              tail -1
          )"

          [[ -n "$SNAP" && -d "$SNAP" ]] || {
            echo "Snapshot directory was not produced." >&2
            exit 30
          }

          TARGET_ID='${{ inputs.board }}__${{ inputs.branch }}__${{ inputs.release }}'

          [[ -d "$SNAP/targets/$TARGET_ID" ]] || {
            echo "Resolved target missing: $TARGET_ID" >&2
            exit 31
          }

          echo "dir=$SNAP" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET_ID" >> "$GITHUB_OUTPUT"

          echo
          echo "===== FROZEN SNAPSHOT ====="
          cat "$SNAP/SNAPSHOT-INFO.txt"

          echo
          echo "===== FROZEN TARGET ====="
          cat "$SNAP/targets/$TARGET_ID/SOURCE-INFO.txt"

      - name: Build and validate Profile C image
        shell: bash
        run: |
          set -euo pipefail

          (
            while true; do
              echo
              echo "===== PROFILE C RESOURCE MONITOR $(date -u --iso-8601=seconds) ====="

              uptime || true

              echo "--- memory ---"
              free -h || true

              echo "--- disk ---"
              df -h / || true

              echo "--- top processes ---"
              ps -eo pid,ppid,state,%cpu,%mem,rss,etime,comm,args \
                --sort=-%cpu |
                head -30 || true

              sleep 60
            done
          ) &

          MONITOR_PID=$!

          stop_monitor() {
            kill "$MONITOR_PID" 2>/dev/null || true
            wait "$MONITOR_PID" 2>/dev/null || true
          }

          trap stop_monitor EXIT

          ./scripts/build-c-snapshot-target.sh \
            '${{ steps.snapshot.outputs.dir }}' \
            '${{ steps.snapshot.outputs.target }}'

      - name: Show Profile C release metadata
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR='${{ steps.snapshot.outputs.dir }}/targets/${{ steps.snapshot.outputs.target }}/c-image'

          [[ -s "$ASSET_DIR/BUILD-INFO.txt" ]] || {
            echo "BUILD-INFO.txt missing" >&2
            exit 40
          }

          [[ -s "$ASSET_DIR/SHA256SUMS" ]] || {
            echo "SHA256SUMS missing" >&2
            exit 41
          }

          echo "===== BUILD INFO ====="
          cat "$ASSET_DIR/BUILD-INFO.txt"

          echo
          echo "===== SHA256SUMS ====="
          cat "$ASSET_DIR/SHA256SUMS"

          echo
          echo "===== RELEASE ASSETS ====="
          ls -lh "$ASSET_DIR"

      - name: Upload Profile C workflow artifact
        if: ${{ inputs.publish == false }}
        uses: actions/upload-artifact@v7
        with:
          name: hardware-base-${{ inputs.board }}-vyos-parity
          path: ${{ steps.snapshot.outputs.dir }}/targets/${{ steps.snapshot.outputs.target }}/c-image/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Profile C release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR='${{ steps.snapshot.outputs.dir }}/targets/${{ steps.snapshot.outputs.target }}/c-image'

          TAG='hb-${{ inputs.board }}-vyos-parity-${{ github.run_number }}'

          {
            echo "Automated Profile C release."
            echo
            echo '```text'
            cat "$ASSET_DIR/BUILD-INFO.txt"
            echo '```'
          } > /tmp/profile-c-release-notes.md

          gh release create "$TAG" \
            "$ASSET_DIR"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ inputs.board }} / Profile C / automated release" \
            --notes-file /tmp/profile-c-release-notes.md
